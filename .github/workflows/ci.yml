name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 📦 Install
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build

      - name: ✅ PR 검증 통과 알림
        if: github.event_name == 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TITLE: PR #${{ github.event.pull_request.number }} CI 통과
          NOTIFY_BODY: ${{ github.event.pull_request.title }}
          NOTIFY_LEVEL: SUCCESS
        run: node scripts/notify.mjs

      - name: 🚨 CI 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TITLE: CI 실패 (PR #${{ github.event.pull_request.number }})
          NOTIFY_BODY: ${{ github.event.pull_request.title }}
          NOTIFY_LEVEL: ERROR
        run: node scripts/notify.mjs
