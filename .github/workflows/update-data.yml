# ── 데이터 갱신 Workflow (매일 자동 + 수동) ────────────────
# OpenRouter 랭킹 + AI 뉴스 RSS 수집 → public/data 커밋 → Vercel 자동 배포.
# 커밋 푸시 시 Vercel가 자동 배포하므로 별도 배포 스텝 불필요.
# 성공/실패 텔레그램 알림 (scripts/notify.mjs).

name: 데이터 갱신 (Data Refresh)

on:
  schedule:
    - cron: '30 18 * * *'   # 매일 KST 03:30 — 새벽 갱신
    - cron: '0 12 * * *'    # 매일 KST 21:00 — 저녁 갱신
  workflow_dispatch:

env:
  NODE_VERSION: 20

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📡 Fetch Data (Rankings + News)
        run: node scripts/fetch-data.mjs

      - name: 📰 Build News
        run: node scripts/build-news.mjs

      - name: "🔗 Sync Unified Models (Tier1: OpenRouter + models.dev + LiteLLM)"
        run: node scripts/sync-models.mjs

      - name: "🧠 Tier Classify (Tier3: Jev 판정)"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/tier-classify.mjs || echo "tier-classify 실패 — 데이터 갱신은 계속"
          if [ -f public/data/model-alerts.json ]; then
            MAJORS=$(node -e "const a=require('./public/data/model-alerts.json').alerts.filter(x=>x.tier==='major'&&x.confidence>=0.45); console.log(a.map(x=>x.name+' ('+x.provider+')').join(', ')||'')")
            if [ -n "$MAJORS" ]; then
              node scripts/notify.mjs "신규 메이저 모델 감지" "$MAJORS — 카탈로그 추가 검토" SUCCESS || true
            fi
          fi

      - name: 🔍 Check for Changes
        id: check
        run: |
          if [[ -n "$(git status --porcelain public/data/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "변경사항 발견 ✅"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경사항 없음 — 스킵"
          fi

      - name: 💾 Commit & Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          UPDATED_AT=$(node -e "try{const m=require('./public/data/meta.json');console.log(m.updatedAtKST||'unknown')}catch(e){console.log('unknown')}" 2>/dev/null || date '+%Y-%m-%d %H:%M')
          git commit -m "chore: 데이터 갱신 ${UPDATED_AT} [skip ci]"
          git push

      - name: 📊 Summary
        run: |
          echo "## 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const fs=require('fs');
            const d='./public/data';
            const r=m=>{try{return JSON.parse(fs.readFileSync(d+'/'+m,'utf-8')).length}catch{return 0}};
            const m=JSON.parse(fs.readFileSync(d+'/meta.json','utf-8'));
            console.log('- 모델 가격: %d개\n- 랭킹: %d개\n- 뉴스: %d개\n- 갱신시각: %s',r('models-pricing.json'),r('rankings.json'),r('rss-merged.json'),m.updatedAtKST||'N/A');
          " >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ 성공 알림 (변경 반영 시)
        if: steps.check.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT=$(node -e "const m=require('./public/data/meta.json'); console.log(m.modelCount + '개 모델 / ' + m.newsCount + '개 뉴스')")
          node scripts/notify.mjs "AI이것만 데이터 갱신 완료" "${COUNT} 반영 · Vercel 자동 배포" SUCCESS

      - name: 🚨 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify.mjs "AI이것만 데이터 갱신 실패" "워크플로우 로그 확인 필요" ERROR
